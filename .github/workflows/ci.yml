name: CI

on:
  # `feature/**` is here because the SDD harness stacks branches: a ticket's PR
  # targets the previous ticket's branch, not develop. Without it, only the first
  # PR of a stack is ever checked and the rest reach review unvalidated.
  pull_request:
    branches: [develop, main, 'feature/**']
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: ktlint + tests + Android artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk 37 is newer than the runner image ships with; this accepts the
      # licences so AGP can pull the missing platform itself.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew :baselogin:testDebugUnitTest

      - name: Assemble library
        run: ./gradlew :baselogin:assembleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: baselogin/build/reports/tests/
          retention-days: 14

  apple:
    name: iOS framework + demo app + JitPack publication
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Link iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      # The step above only links the Kotlin framework. Nothing compiled the Swift
      # in iosApp/ — the coordinators were written on Windows, where they cannot be
      # built at all — so a syntax or API error there reached develop unnoticed.
      #
      # Signing is off: the runner holds no certificates and a simulator build needs
      # none. ARCHS is pinned because iosSimulatorArm64 is the only simulator target
      # the project declares; if Xcode picked x86_64 on an Intel runner, the Gradle
      # `embedAndSignAppleFrameworkForXcode` run script phase would fail on it.
      # GoogleService-Info.plist is absent here on purpose (it is gitignored) and
      # that is fine — it is not a build input, the app only reads it at launch.
      - name: Build the iOS demo app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Reproduces exactly what the JitPack builder runs (jitpack.yml: osx + JDK 17
      # + publishToMavenLocal). JITPACK=true is what disables ktlint in the root
      # build — publishing broke once because the linter was in that path, and this
      # job is here so it cannot break silently again.
      - name: Publication (as JitPack runs it)
        env:
          JITPACK: 'true'
        run: ./gradlew :baselogin:publishToMavenLocal

name: CI

on:
  # `feature/**` is here because the SDD harness stacks branches: a ticket's PR
  # targets the previous ticket's branch, not develop. Without it, only the first
  # PR of a stack is ever checked and the rest reach review unvalidated.
  pull_request:
    branches: [develop, main, 'feature/**']
  push:
    branches: [develop, main]
    # Publishing is driven by the tag, and the tag must equal `version` in
    # baselogin/build.gradle.kts.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: ktlint + tests + Android artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk 37 is newer than the runner image ships with; this accepts the
      # licences so AGP can pull the missing platform itself.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew :baselogin:testDebugUnitTest

      - name: Assemble library
        run: ./gradlew :baselogin:assembleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: baselogin/build/reports/tests/
          retention-days: 14

  apple:
    name: iOS framework + demo app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Link iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      # The step above only links the Kotlin framework. Nothing compiled the Swift
      # in iosApp/ — the coordinators were written on Windows, where they cannot be
      # built at all — so a syntax or API error there reached develop unnoticed.
      #
      # Signing is off: the runner holds no certificates and a simulator build needs
      # none. ARCHS is pinned because iosSimulatorArm64 is the only simulator target
      # the project declares; if Xcode picked x86_64 on an Intel runner, the Gradle
      # `embedAndSignAppleFrameworkForXcode` run script phase would fail on it.
      # GoogleService-Info.plist is absent here on purpose (it is gitignored) and
      # that is fine — it is not a build input, the app only reads it at launch.
      - name: Build the iOS demo app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  # Runs only for a version tag, and only once the library and the Apple side are both green:
  # a publication that fails validation is recoverable, one that publishes a broken artifact is not.
  #
  # macOS is not strictly required. Kotlin/Native cross-compiles the Apple *klibs* from any host, and
  # that was measured here: a Windows `publishToMavenLocal` produced both baselogin-iosarm64 and
  # baselogin-iossimulatorarm64 at ~640 KB each. The macOS-only rules are final Apple binaries and
  # projects that declare cinterop or CocoaPods dependencies — this one declares neither.
  #
  # It runs on macOS anyway, deliberately: klib cross-compilation is still being stabilised, a
  # released version on Central can never be deleted or overwritten, and this is the same runner that
  # already builds the framework and the demo. For the one irreversible step, use the host with no
  # caveats attached.
  #
  # The gradle task uploads to a pending deployment and stops; releasing is a manual step in the
  # Central Portal. See the `mavenPublishing` block in baselogin/build.gradle.kts.
  release:
    name: Publish to Maven Central (pending deployment)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [library, apple]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        # skipKtlint because publishing must never depend on the linter: it already broke a
        # publication once. ktlintCheck still gates this job through `needs: library`.
        run: ./gradlew :baselogin:publishToMavenCentral --no-configuration-cache -PskipKtlint=true
